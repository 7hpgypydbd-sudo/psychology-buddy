<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Buddy">
<meta name="theme-color" content="#EEF3F7" id="themeColor">
<title>Psychology Buddy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#EEF3F7; --card:#FFFFFF; --card2:#F6F9FB; --text:#26384A; --muted:#6B7C8C; --line:#DCE4EB;
  --accent:#4F7FA8; --accent2:#6C9BC2; --accentSoft:#E1EBF4; --onAccent:#FFFFFF;
  --warm:#C98A6B; --warmSoft:#F6E8E0; --good:#5E9C83; --goodSoft:#E2F0EA; --danger:#B4585A;
  --shadow:0 1px 2px rgba(38,56,74,.06), 0 6px 18px rgba(38,56,74,.07);
  --shadowUp:0 -4px 20px rgba(38,56,74,.08);
  --r:20px; --safeT:env(safe-area-inset-top); --safeB:env(safe-area-inset-bottom);
  color-scheme: light;
}
:root[data-theme="night"]{
  --bg:#1C1E26; --card:#272A35; --card2:#2F3240; --text:#E6E3F0; --muted:#9C99AD; --line:#363949;
  --accent:#9D8CE0; --accent2:#B5A8EA; --accentSoft:#34304A; --onAccent:#1C1E26;
  --warm:#E0A98C; --warmSoft:#3D3330; --good:#86C2A8; --goodSoft:#2B3A35; --danger:#E08C8E;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 8px 22px rgba(0,0,0,.25);
  --shadowUp:0 -4px 20px rgba(0,0,0,.3);
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;transition:background .3s,color .3s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
.hidden{display:none!important}

/* layout */
#app{max-width:560px;margin:0 auto;padding:calc(var(--safeT) + 14px) 16px calc(var(--safeB) + 104px)}
.screen{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px}
.top h1{font-size:28px}
.top .sub{color:var(--muted);font-size:14px;font-weight:600}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);transition:transform .12s}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:22px;height:22px;stroke:var(--text)}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card.tight{padding:14px 16px}
.card h2{font-size:18px}
.card .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card .head .link{color:var(--accent);font-weight:700;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.press{transition:transform .12s ease, box-shadow .12s}
.press:active{transform:scale(.97)}

/* countdown hero */
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onAccent);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:before{content:"";position:absolute;right:30px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .big{font-size:52px;font-weight:800;line-height:1}
.hero .unit{font-size:18px;font-weight:700;opacity:.9}
.hero .when{margin-top:6px;font-weight:600;opacity:.92}
.hero .row{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1;flex-wrap:wrap}
.hero .pill{background:rgba(255,255,255,.22);color:var(--onAccent);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
:root[data-theme="night"] .hero .pill{background:rgba(28,30,38,.18)}

.banner{display:flex;gap:12px;align-items:center;background:var(--warmSoft);color:var(--text);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:600;font-size:15px}
.banner .dot{width:10px;height:10px;border-radius:50%;background:var(--warm);flex:none;box-shadow:0 0 0 4px rgba(201,138,107,.2)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;text-align:left}
.stat .n{font-size:30px;font-weight:800;line-height:1.1}
.stat .l{color:var(--muted);font-weight:700;font-size:13px}

/* todo rows */
.todo{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0;padding-top:2px}
.check{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--accent2);display:grid;place-items:center;transition:all .18s;margin-top:1px}
.check svg{width:16px;height:16px;stroke:var(--onAccent);stroke-width:3;opacity:0;transform:scale(.5);transition:all .18s}
.todo.done .check{background:var(--accent);border-color:var(--accent)}
.todo.done .check svg{opacity:1;transform:none}
.todo .t{flex:1;font-weight:600}
.todo.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.todo .k{font-size:12px;font-weight:800;color:var(--accent);background:var(--accentSoft);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px;text-decoration:none;display:inline-block}
.progress{height:8px;border-radius:99px;background:var(--accentSoft);overflow:hidden;margin:4px 0 6px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:8px 14px;background:var(--card2);border:1.5px solid var(--line);font-weight:700;font-size:14px;transition:all .15s;white-space:nowrap}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.chip.add{border-style:dashed;color:var(--muted);background:transparent}
.chip.sm{padding:4px 10px;font-size:12px}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--accentSoft);color:var(--accent);margin:0 4px 4px 0}
.tag.warm{background:var(--warmSoft);color:var(--warm)}
.tag.good{background:var(--goodSoft);color:var(--good)}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}

/* moods */
.moods{display:flex;justify-content:space-between;gap:6px}
.mood{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;border-radius:16px;background:var(--card2);border:1.5px solid transparent;transition:all .15s}
.mood:active{transform:scale(.92)}
.mood .e{font-size:28px;line-height:1;filter:saturate(.85)}
.mood .w{font-size:12px;font-weight:700;color:var(--muted)}
.mood.on{border-color:var(--accent);background:var(--accentSoft)}
.mood.on .w{color:var(--accent)}

/* notes */
.day{margin:18px 4px 8px}
.note{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;display:block;width:100%;text-align:left;position:relative}
.note .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:4px}
.note .txt{font-weight:600;white-space:pre-wrap;word-wrap:break-word}
.note .tags{margin-top:8px}
.note.discussed{opacity:.72}
.note .star{position:absolute;right:14px;top:12px;color:var(--warm)}
.kind{font-size:12px;font-weight:800;color:var(--accent)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:16px;padding:15px 18px;font-weight:800;font-size:16px;background:var(--accent);color:var(--onAccent);box-shadow:0 4px 14px rgba(79,127,168,.3);transition:transform .12s,opacity .2s}
:root[data-theme="night"] .btn{box-shadow:0 4px 14px rgba(157,140,224,.25)}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--accentSoft);color:var(--accent);box-shadow:none}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none;border:1.5px solid var(--line)}
.btn.warm{background:var(--warm);color:#fff;box-shadow:0 4px 14px rgba(201,138,107,.3)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:none;border:1.5px solid var(--line)}
.btn[disabled]{opacity:.5}
.btn svg{width:20px;height:20px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
.talkbtn{padding:20px;font-size:18px;border-radius:20px}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);box-shadow:var(--shadowUp);padding:8px 10px calc(var(--safeB) + 8px);border-radius:24px 24px 0 0}
#tabs .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-around}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:6px 10px;border-radius:14px;min-width:60px;transition:color .15s}
.tab svg{width:24px;height:24px;stroke:currentColor}
.tab.on{color:var(--accent)}
.tab:active{transform:scale(.92)}
.fab{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onAccent);display:grid;place-items:center;box-shadow:0 6px 18px rgba(79,127,168,.4);margin-top:-26px;transition:transform .12s}
:root[data-theme="night"] .fab{box-shadow:0 6px 18px rgba(157,140,224,.35)}
.fab:active{transform:scale(.9)}
.fab svg{width:28px;height:28px;stroke:var(--onAccent);stroke-width:2.5}

/* sheets */
#scrim{position:fixed;inset:0;background:rgba(20,28,38,.38);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:94vh;display:flex;flex-direction:column;background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadowUp)}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:9px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 8px;flex:none;max-width:560px;width:100%;margin:0 auto}
.sheet .sh h2{font-size:21px}
.sheet .sb{overflow-y:auto;padding:4px 16px calc(var(--safeB) + 24px);-webkit-overflow-scrolling:touch;max-width:560px;width:100%;margin:0 auto}
.close{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.close svg{width:18px;height:18px;stroke:var(--text)}
.field{margin-bottom:16px}
.field > label, .lbl{display:block;font-weight:800;font-size:14px;margin:0 2px 8px}
textarea,input[type=text],input[type=password],input[type=datetime-local],input[type=date],input[type=number],select{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:13px 14px;font-size:16px;outline:none;transition:border-color .15s}
textarea:focus,input:focus,select:focus{border-color:var(--accent2)}
textarea{min-height:120px;resize:vertical;line-height:1.45}
textarea.big{min-height:220px}
.section{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.section .lbl{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
details.section summary{list-style:none;font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center}
details.section summary::-webkit-details-marker{display:none}
details.section summary .cnt{color:var(--accent);font-size:13px}
details.section[open] summary{margin-bottom:12px}
details.section summary:after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:8px;transition:transform .2s;margin-top:-4px}
details.section[open] summary:after{transform:rotate(-135deg);margin-top:4px}
details.section summary .r{display:flex;align-items:center;gap:6px;margin-left:auto}

/* review items */
.ritem{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.ritem:first-of-type{border-top:0}
.ritem textarea{border:0;background:transparent;padding:2px 0;border-radius:0;font-weight:600;min-height:0;resize:none;overflow:hidden;flex:1;line-height:1.4}
.ritem.off textarea{color:var(--muted);text-decoration:line-through}
.ritem .x{color:var(--muted);font-size:20px;line-height:1;padding:2px 4px}
.coach{background:linear-gradient(135deg,var(--goodSoft),var(--accentSoft));}
.coach .q{font-size:17px;font-weight:700;line-height:1.4}
.coach .from{margin-top:8px}

/* talk card */
#talk{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(var(--safeT) + 16px) 20px calc(var(--safeB) + 20px);opacity:0;pointer-events:none;transition:opacity .25s}
#talk.on{opacity:1;pointer-events:auto}
#talk .tc{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:520px;margin:0 auto;width:100%}
#talk .bigcard{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:28px 24px;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
#talk .bigcard .q{font-size:22px;font-weight:800;line-height:1.35;margin:10px 0 12px;white-space:pre-wrap}
#talk .counter{text-align:center;font-weight:800;color:var(--muted);margin-bottom:14px}

/* lock */
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);transition:background .15s}
.dots i.f{background:var(--accent)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:26px;font-weight:700}
.pad button:active{transform:scale(.92);background:var(--accentSoft)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--safeB) + 100px);transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:all .25s;z-index:70;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty .ic{font-size:40px;margin-bottom:6px}
.spark{width:100%;height:56px}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px;font-weight:700}
.bar .lb{width:110px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;height:10px;border-radius:9px;background:var(--accentSoft);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent2);border-radius:9px}
.bar .c{width:22px;text-align:right;color:var(--muted)}
.theme{padding:12px;border-radius:16px;margin-bottom:10px;background:var(--card2)}
.theme h3{font-size:16px;margin-bottom:4px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:11px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.list-sel{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--card);margin-bottom:8px;box-shadow:var(--shadow);width:100%;text-align:left}
.list-sel.on{outline:2px solid var(--accent)}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.summaryText{white-space:pre-wrap;font-size:14px;color:var(--muted);max-height:180px;overflow:hidden;position:relative}
.summaryText.open{max-height:none}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin:4px 0;font-weight:600}
a{color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>

<nav id="tabs"><div class="in">
  <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button class="tab" data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Notes</button>
  <button class="fab" data-action="newNote" aria-label="Log a note"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-tab="prep"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Next session</button>
  <button class="tab" data-tab="sessions"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Sessions</button>
</div></nav>

<div id="scrim"></div>
<div id="sheet" class="sheet"><div class="grab"></div><div class="sh"><h2 id="sheetTitle"></h2><button class="close" data-action="closeSheet" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="sb" id="sheetBody"></div></div>
<div id="talk"></div>
<div id="lock" class="hidden"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script src="app.js?v=3"></script>
</body>
</html>
